name = "niwa-pustaka-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787

[vars]
AUTH_API_URL = "http://localhost:8788"
JWT_ISSUER = "https://auth.api.hendrasadewa.com"

# Production Cloudflare Service Binding (enable once niwa-auth-api is deployed):
# [[services]]
# binding = "AUTH_API"
# service = "niwa-auth-api"

[[d1_databases]]
binding = "DB"
database_name = "pustaka-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "pustaka-covers"
