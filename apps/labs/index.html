<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var pref = localStorage.getItem("niwa:color-scheme");
        if (pref === "light" || pref === "dark") {
          document.querySelector('meta[name="color-scheme"]').content = pref;
          document.documentElement.setAttribute("data-theme", pref);
          document.documentElement.classList.add(pref);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..700;1,400&family=Playfair+Display:ital,wght@0,400..700;1,400..600&display=swap"
      crossorigin="anonymous"
    />
    <title>labs | niwa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
