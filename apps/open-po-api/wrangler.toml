name = "niwa-open-po-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[vars]
JWT_SECRET = "open-po-local-dev-jwt-secret-key"

[[d1_databases]]
binding = "DB"
database_name = "open-po-db"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "drizzle"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "open-po-media"
