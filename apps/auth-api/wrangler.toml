name = "niwa-auth-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8788

[vars]
JWT_SECRET = "open-po-local-dev-jwt-secret-key"

[[d1_databases]]
binding = "DB"
database_name = "niwa-auth-db"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "drizzle"
